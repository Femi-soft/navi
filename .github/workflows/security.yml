name: Security gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contracts:compile
      - uses: crytic/slither-action@v0.4.2
        with:
          ignore-compile: true
          fail-on: high
          slither-version: 0.11.6
          slither-args: --filter-paths "node_modules|contracts/test" --exclude-dependencies
