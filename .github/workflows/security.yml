name: Security gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Audit deployed dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Create commit-bound audit manifest
        run: node scripts/create-audit-manifest.mjs > audit-manifest.json
      - name: Validate audit manifest JSON
        run: node -e "const fs=require('node:fs'); const manifest=JSON.parse(fs.readFileSync('audit-manifest.json','utf8')); if (manifest.commit !== process.env.GITHUB_SHA || !manifest.cleanWorktree || manifest.worktreeStatus.length) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: navi-audit-manifest-${{ github.sha }}
          path: audit-manifest.json
          if-no-files-found: error
          retention-days: 90

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contracts:compile
      - uses: crytic/slither-action@v0.4.2
        with:
          ignore-compile: true
          fail-on: high
          slither-version: 0.11.6
          slither-args: --filter-paths "node_modules|contracts/test|contracts/adapters/AaveSupplyWithdrawAdapterV2.sol|contracts/adapters/BoundedERC4626AdapterV2.sol" --exclude-dependencies
